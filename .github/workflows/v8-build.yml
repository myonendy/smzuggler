#
# Build the pinned V8 monolith with tools/v8/build_v8.sh and upload the
# install as an artifact (docs/build-v8.md, "How CI gets V8"). Run by hand
# only: a build takes hours and is needed once per pin or GN-arg change.
name: V8 build
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
    env:
      V8_VERSION: 13.6.233.8
      SMZ_DEPS_DIR: ${{ github.workspace }}/.v8-deps
    steps:
      # The checkout and build need 30+ GB; drop preinstalled SDKs we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the pin
        run: |
          pin=$(sed -n 's/^V8_VERSION=//p' tools/v8/build_v8.sh)
          [ "$pin" = "$V8_VERSION" ] || { echo "pin is $pin, workflow says $V8_VERSION"; exit 1; }
          bash tools/v8/build_v8.sh --print-args
      - name: Build V8
        run: SMZ_JOBS=$(nproc) bash tools/v8/build_v8.sh
      - name: Pack the install
        run: |
          df -h /
          cd "$SMZ_DEPS_DIR/v8"
          name=v8-$V8_VERSION-linux-x64
          tar -cJf "$GITHUB_WORKSPACE/$name.tar.xz" "$V8_VERSION"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$name.tar.xz" | tee "$name.tar.xz.sha256"
          ls -l "$name.tar.xz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v8-${{ env.V8_VERSION }}-linux-x64
          path: |
            v8-${{ env.V8_VERSION }}-linux-x64.tar.xz
            v8-${{ env.V8_VERSION }}-linux-x64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 90
