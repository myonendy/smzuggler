#
# Build the pinned V8 monolith with tools/v8/build_v8.sh and upload the
# install as an artifact (docs/build-v8.md, "How CI gets V8"). Run by hand
# only: a build takes hours and is needed once per pin or GN-arg change.
# Resumable: the build step is capped well under the 6-hour job limit and the
# ccache directory is saved even on failure or timeout, so a rerun picks up
# where the last one stopped. The gn out dir path is fixed by build_v8.sh.
name: V8 build
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
    env:
      V8_VERSION: 13.6.233.8
      SMZ_DEPS_DIR: ${{ github.workspace }}/.v8-deps
      SMZ_V8_CC_WRAPPER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.v8-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: '1'
      CCACHE_MAXSIZE: 6G
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines
    steps:
      # The checkout and build need about 30 GB; hosted runners have 80+ GB
      # free, so only report it (deleting preinstalled SDKs took 9 minutes).
      - name: Show free disk space
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the pin
        run: |
          pin=$(sed -n 's/^V8_VERSION=//p' tools/v8/build_v8.sh)
          [ "$pin" = "$V8_VERSION" ] || { echo "pin is $pin, workflow says $V8_VERSION"; exit 1; }
          bash tools/v8/build_v8.sh --print-args
      # Without V8's sysroot (use_sysroot = false), gn's //build/config/linux
      # pkg_config("glib") check needs the host's glib development files.
      - name: Install host build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache libglib2.0-dev pkg-config
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .v8-ccache
          key: v8-ccache-${{ env.V8_VERSION }}-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v8-ccache-${{ env.V8_VERSION }}-linux-x64-
      - name: Build V8
        timeout-minutes: 325
        run: |
          ccache -z
          # Stop on our own before the step and job limits so the cache saves.
          SMZ_JOBS=$(nproc) timeout -k 2m 315m bash tools/v8/build_v8.sh
      - name: ccache stats
        if: always()
        run: ccache -s || true
      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .v8-ccache
          key: v8-ccache-${{ env.V8_VERSION }}-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Pack the install
        run: |
          df -h /
          cd "$SMZ_DEPS_DIR/v8"
          name=v8-$V8_VERSION-linux-x64
          tar -cJf "$GITHUB_WORKSPACE/$name.tar.xz" "$V8_VERSION"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$name.tar.xz" | tee "$name.tar.xz.sha256"
          ls -l "$name.tar.xz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v8-${{ env.V8_VERSION }}-linux-x64
          path: |
            v8-${{ env.V8_VERSION }}-linux-x64.tar.xz
            v8-${{ env.V8_VERSION }}-linux-x64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 90
