#
# Exercise the QuickJS baseline without game material; see docs/testing.md.
# Keep configure, build, ctest and Python suites in that order on every OS.
name: CI
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python test dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb openbox \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdbus-1-dev libudev-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev \
            mesa-vulkan-drivers libvulkan1

      - name: Configure QuickJS baseline
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRMMZ_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          openbox &
          sleep 2
          ctest --test-dir build -C Release --output-on-failure --timeout 600
      - name: Run Python tool tests
        run: |
          for directory in tools/privacy tools/commitmsg tests/tools; do
            python -m unittest discover -s "$directory" -p 'test_*.py'
          done
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python test dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Configure QuickJS baseline
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DRMMZ_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 600
      - name: Run Python tool tests
        run: |
          for directory in tools/privacy tools/commitmsg tests/tools; do
            python -m unittest discover -s "$directory" -p 'test_*.py'
          done
  macos:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python test dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Install macOS dependencies
        run: brew install ninja
      - name: Configure QuickJS baseline
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRMMZ_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 600
      - name: Run Python tool tests
        run: |
          for directory in tools/privacy tools/commitmsg tests/tools; do
            python -m unittest discover -s "$directory" -p 'test_*.py'
          done
